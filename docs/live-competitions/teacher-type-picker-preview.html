<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live competitions — type picker preview</title>
  <style>
    :root {
      --ink: #14212b;
      --muted: #6b7a86;
      --line: #e4eaef;
      --bg: #f5f7f9;
      --teal: #1ebba3;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Nunito", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .shell {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }
    .nav {
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 20px 16px;
    }
    .brand {
      font-weight: 800;
      color: var(--teal);
      margin-bottom: 28px;
      font-size: 1.15rem;
    }
    .nav a {
      display: block;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 4px;
    }
    .nav a.active {
      background: rgba(30, 187, 163, 0.12);
      color: var(--teal);
      font-weight: 700;
    }
    .main { padding: 32px 40px; }
    h1 { margin: 0 0 6px; font-size: 1.8rem; }
    .sub { margin: 0 0 28px; color: var(--muted); }
    .types {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 40px;
    }
    .type {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      text-align: left;
      cursor: pointer;
      padding: 0;
      font: inherit;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }
    .type:hover,
    .type:focus-visible {
      border-color: var(--teal);
      outline: none;
      transform: translateY(-2px);
    }
    .type-art {
      height: 150px;
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .classic .type-art {
      background: linear-gradient(160deg, #16324f, #0b1c33);
      color: #f4f7fb;
    }
    .hacking .type-art {
      background: #07140f;
      color: #39ff88;
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
    }
    .gold .type-art {
      background: linear-gradient(160deg, #c9892d, #8a5a12);
      color: #fff8e7;
    }
    .type-body { padding: 16px 18px 18px; }
    .type-body strong { display: block; font-size: 1.15rem; margin-bottom: 4px; }
    .type-body span { color: var(--muted); font-size: 0.92rem; }
    h2 { font-size: 1.05rem; margin: 0 0 12px; }
    .session {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .session small { color: var(--teal); font-weight: 700; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .status i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      display: inline-block;
    }
    .enter {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .nav { display: none; }
      .types { grid-template-columns: 1fr; }
      .main { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="nav">
      <div class="brand">Aboutabl</div>
      <a href="#">Dashboard</a>
      <a href="#">Classes</a>
      <a class="active" href="#">Live competitions</a>
      <a href="#">Settings</a>
    </aside>
    <main class="main">
      <h1>Live competitions</h1>
      <p class="sub">Pick a game type</p>
      <div class="types">
        <button type="button" class="type classic">
          <div class="type-art">CAMPFIRE</div>
          <div class="type-body">
            <strong>Classic</strong>
            <span>Campfire race</span>
          </div>
        </button>
        <button type="button" class="type hacking">
          <div class="type-art">&gt; access_granted_</div>
          <div class="type-body">
            <strong>hacking</strong>
            <span>Password protocols</span>
          </div>
        </button>
        <button type="button" class="type gold">
          <div class="type-art">TREASURE</div>
          <div class="type-body">
            <strong>GoldQuest</strong>
            <span>Treasure chests</span>
          </div>
        </button>
      </div>
      <h2>Your active sessions</h2>
      <div class="session">
        <div>
          <div><strong>Session #12</strong></div>
          <small>code AB12CD</small>
        </div>
        <span class="status"><i></i> lobby</span>
        <button type="button" class="enter">Enter lobby</button>
      </div>
    </main>
  </div>
</body>
</html>
